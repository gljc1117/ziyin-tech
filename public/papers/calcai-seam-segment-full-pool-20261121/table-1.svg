<svg xmlns="http://www.w3.org/2000/svg" width="1077" height="574" viewBox="0 0 1077 574" role="img" aria-labelledby="title desc"><title id="title">表 1　七个开发病例的新起点与主模型排序结果</title><desc id="desc">新起点，全部生成，术前准入，准入中通过原几何验收，主模型前 40 几何合格，主模型首选。开发例 A，1,469，1,127，0，0，原位。开发例 B，1,475，1,214，3，0，仅 PF 移动，退化。开发例 C，1,466，1,143，0，0，原位。开发例 D，1,378，1,156，0，0，原位。开发例 E，1,471，1,152，0，0，原位。开发例 F，1,468，1,155，0，0，原位。开发例 G，1,483，1,154，0，0，原位。合计，10,210，8,101，3，0，0/7 几何合格</desc><g font-family="system-ui, Microsoft YaHei, sans-serif" font-size="23"><rect x="0" y="0" width="1077" height="94" fill="#173848"/><text x="15" y="38" fill="#ffffff">新起点</text><text x="160" y="38" fill="#ffffff">全部生成</text><text x="290" y="38" fill="#ffffff">术前准入</text><text x="420" y="38" fill="#ffffff">准入中通过原几</text><text x="420" y="72" fill="#ffffff">何验收</text><text x="632" y="38" fill="#ffffff">主模型前 40 几</text><text x="632" y="72" fill="#ffffff">何合格</text><text x="832" y="38" fill="#ffffff">主模型首选</text><path d="M0 94H1077" stroke="#b5c5c9"/><rect x="0" y="94" width="1077" height="60" fill="#ffffff"/><text x="15" y="132" fill="#193744">开发例 A</text><text x="160" y="132" fill="#193744">1,469</text><text x="290" y="132" fill="#193744">1,127</text><text x="420" y="132" fill="#193744">0</text><text x="632" y="132" fill="#193744">0</text><text x="832" y="132" fill="#193744">原位</text><path d="M0 154H1077" stroke="#b5c5c9"/><rect x="0" y="154" width="1077" height="60" fill="#edf4f5"/><text x="15" y="192" fill="#193744">开发例 B</text><text x="160" y="192" fill="#193744">1,475</text><text x="290" y="192" fill="#193744">1,214</text><text x="420" y="192" fill="#193744">3</text><text x="632" y="192" fill="#193744">0</text><text x="832" y="192" fill="#193744">仅 PF 移动，退化</text><path d="M0 214H1077" stroke="#b5c5c9"/><rect x="0" y="214" width="1077" height="60" fill="#ffffff"/><text x="15" y="252" fill="#193744">开发例 C</text><text x="160" y="252" fill="#193744">1,466</text><text x="290" y="252" fill="#193744">1,143</text><text x="420" y