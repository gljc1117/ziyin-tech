<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="214" viewBox="0 0 1100 214" role="img" aria-labelledby="title desc"><title id="title">表 4　冻结模型在两个历史正式起点的表现</title><desc id="desc">病例，完整历史池，按统一原术前门限准入，准入中原几何合格，主模型在准入前 40 命中，首选，最好合格名次。历史例甲，160,115，11,893，22，0，原位，223。历史例乙，43,269，11,702，207，0，原位，199</desc><g font-family="system-ui, Microsoft YaHei, sans-serif" font-size="23"><rect x="0" y="0" width="1100" height="94" fill="#173848"/><text x="15" y="38" fill="#ffffff">病例</text><text x="165" y="38" fill="#ffffff">完整历史池</text><text x="325" y="38" fill="#ffffff">按统一原术前</text><text x="325" y="72" fill="#ffffff">门限准入</text><text x="515" y="38" fill="#ffffff">准入中原几</text><text x="515" y="72" fill="#ffffff">何合格</text><text x="680" y="38" fill="#ffffff">主模型在准入</text><text x="680" y="72" fill="#ffffff">前 40 命中</text><text x="850" y="38" fill="#ffffff">首选</text><text x="960" y="38" fill="#ffffff">最好合格名</text><text x="960" y="72" fill="#ffffff">次</text><path d="M0 94H1100" stroke="#b5c5c9"/><rect x="0" y="94" width="1100" height="60" fill="#ffffff"/><text x="15" y="132" fill="#193744">历史例甲</text><text x="165" y="132" fill="#193744">160,115</text><text x="325" y="132" fill="#193744">11,893</text><text x="515" y="132" fill="#193744">22</text><text x="680" y="132" fill="#193744">0</text><text x="850" y="132" fill="#193744">原位</text><text x="960" y="132" fill="#193744">223</text><path d="M0 154H1100" stroke="#b5c5c9"/><rect x="0" y="154" width="1100" height="60" fill="#edf4f5"/><text x="15" y="192" fill="#193744">历史例乙</text><text x="165" y="192" fill="#193744">43,269</text><text x="325" y="192" fill="#193744">11,702</text><text x="515" y="192" fill="#193744">207</text><text x="680" y="192" fill="#193744">0</text><text x="850" y="192" fill="#193744">原位</text><text x="960" y="192" fill="#193744">199</text><path d="M0 214H1100" stroke="#b5c5c9"/></g></svg>