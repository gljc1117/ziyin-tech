<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="334" viewBox="0 0 1100 334" role="img" aria-labelledby="title desc"><title id="title">表 3　最高报警与实测最坏项的一致性</title><desc id="desc">在 7,898 个实际退化动作中，最高报警同时指出，主模型，扩展弧模型。正确的最坏骨对，1,813，1,664。正确骨对与四种物理分量之一，420，471。正确骨对、物理分量，以及原值或对人工偏差，417，467。唯一空间代理段及上述八项通道，4 / 124 个可对照动作，无可对照动作</desc><g font-family="system-ui, Microsoft YaHei, sans-serif" font-size="23"><rect x="0" y="0" width="1100" height="60" fill="#173848"/><text x="15" y="38" fill="#ffffff">在 7,898 个实际退化动作中，最高报警同时指出</text><text x="605" y="38" fill="#ffffff">主模型</text><text x="845" y="38" fill="#ffffff">扩展弧模型</text><path d="M0 60H1100" stroke="#b5c5c9"/><rect x="0" y="60" width="1100" height="60" fill="#ffffff"/><text x="15" y="98" fill="#193744">正确的最坏骨对</text><text x="605" y="98" fill="#193744">1,813</text><text x="845" y="98" fill="#193744">1,664</text><path d="M0 120H1100" stroke="#b5c5c9"/><rect x="0" y="120" width="1100" height="60" fill="#edf4f5"/><text x="15" y="158" fill="#193744">正确骨对与四种物理分量之一</text><text x="605" y="158" fill="#193744">420</text><text x="845" y="158" fill="#193744">471</text><path d="M0 180H1100" stroke="#b5c5c9"/><rect x="0" y="180" width="1100" height="60" fill="#ffffff"/><text x="15" y="218" fill="#193744">正确骨对、物理分量，以及原值或对人工偏差</text><text x="605" y="218" fill="#193744">417</text><text x="845" y="218" fill="#193744">467</text><path d="M0 240H1100" stroke="#b5c5c9"/><rect x="0" y="240" width="1100" height="94" fill="#edf4f5"/><text x="15" y="278" fill="#193744">唯一空间代理段及上述八项通道</text><text x="605" y="278" fill="#193744">4 / 124 个可对照动</text><text x="605" y="312" fill="#193744">作</text><text x="845" y="278" fill="#193744">无可对照动作</text><path d="M0 334H1100" stroke="#b5c5c9"/></g></svg>