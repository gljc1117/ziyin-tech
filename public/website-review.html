<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>官网候选页面验收</title>
<style>body{margin:0;font:14px/1.6 Arial,sans-serif;background:#e7edf4;color:#14243d}header{padding:16px 24px;background:white}label{margin-right:20px}select{padding:8px}.stage{padding:20px;overflow:auto}iframe{display:block;margin:auto;width:1360px;height:850px;border:1px solid #bbb;background:white}</style>
<header><strong>官网候选页面验收</strong> <label>页面 <select id="page"><option value="/">首页</option><option value="/qualifications">资质中心</option><option value="/products/bone-model">骨模型</option><option value="/solutions">医院解决方案</option><option value="/support">服务支持</option><option value="/search">搜索</option><option value="/demo">合作咨询</option></select></label><label>宽度 <select id="width"><option value="1360">1360px</option><option value="390">390px</option><option value="320">320px</option><option value="768">768px</option></select></label></header>
<div class="stage"><iframe id="preview" src="/" title="官网候选页面"></iframe></div>
<script>const frame=document.getElementById("preview");document.getElementById("page").addEventListener("change",event=>frame.src=event.target.value);document.getElementById("width").addEventListener("change",event=>frame.style.width=event.target.value+"px");</script>
</html>
