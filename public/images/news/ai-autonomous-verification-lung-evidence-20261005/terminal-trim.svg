<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">45个末端缩短场景的互补检查</title><desc id="desc">同一批45个场景中，旧组合签名变化9个，链几何变化39个，原Mask末端退缩45个。计数不代表临床灵敏度。</desc><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .h{font-size:32px;font-weight:700;fill:#102e4a} .t{font-size:26px;font-weight:700;fill:#123452} .p{font-size:22px;fill:#38536b} .n{font-size:20px;fill:#4f6173}</style><rect width="1000" height="100%" fill="#f5f8fc"/><text x="52" y="68" class="h">同一处末端损失，不同表示所见不同</text><text x="52" y="108" class="n">45个受控末端缩短场景 · 按场景计数</text><text x="52" y="217" class="p">旧组合签名变化</text><rect x="315" y="185" width="558" height="48" rx="6" fill="#e0e7ef"/><rect x="315" y="185" width="111.6" height="48" rx="6" fill="#8292a4"/><text x="894" y="218" font-size="25" font-weight="700" fill="#102e4a">9</text><text x="52" y="327" class="p">有支持的链几何变化</text><rect x="315" y="295" width="558" height="48" rx="6" fill="#e0e7ef"/><rect x="315" y="295" width="483.6" height="48" rx="6" fill="#2563a5"/><text x="894" y="328" font-size="25" font-weight="700" fill="#102e4a">39</text><text x="52" y="437" class="p">原Mask末端退缩</text><rect x="315" y="405" width="558" height="48" rx="6" fill="#e0e7ef"/><rect x="315" y="405" width="558.0" height="48" rx="6" fill="#157c87"/><text x="894" y="438" font-size="25" font-weight="700" fill="#102e4a">45</text><text x="52" y="527" class="p">6个场景的骨架点集完全未变，Mask层仍记录到退缩。</text><text x="52" y="571" class="n">各计数来自同一批相关场景，不能相加，也不作为临床检出率。</text></svg>