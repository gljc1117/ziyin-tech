<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">分层几何检查与来源证据</title><desc id="desc">六类证据：物理表示、Mask覆盖、链几何、共享片段、分叉簇、来源追溯。各层保留未解决问题。</desc><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .h{font-size:32px;font-weight:700;fill:#102e4a} .t{font-size:26px;font-weight:700;fill:#123452} .p{font-size:22px;fill:#38536b} .n{font-size:20px;fill:#4f6173}</style><rect width="1000" height="100%" fill="#f5f8fc"/><text x="52" y="70" class="h">从输入到解释，逐层保留证据</text><text x="52" y="110" class="n">AI自主验证 · R10—R15探索性工程研究</text><rect x="52" y="148" width="436" height="144" rx="16" fill="white" stroke="#d2e0ec"/><rect x="52" y="168" width="5" height="102" rx="2" fill="#157c87"/><text x="76" y="188" class="t">01 物理表示</text><text x="76" y="230" class="p">统一轴与方向</text><text x="76" y="265" class="n">检查等价编码是否一致</text><rect x="512" y="148" width="436" height="144" rx="16" fill="white" stroke="#d2e0ec"/><rect x="512" y="168" width="5" height="102" rx="2" fill="#157c87"/><text x="536" y="188" class="t">02 Mask覆盖</text><text x="536" y="230" class="p">从原体素独立计算</text><text x="536" y="265" class="n">记录骨架遗漏的小域与末端</text><rect x="52" y="314" width="436" height="144" rx="16" fill="white" stroke="#d2e0ec"/><rect x="52" y="334" width="5" height="102" rx="2" fill="#157c87"/><text x="76" y="354" class="t">03 链几何</text><text x="76" y="396" class="p">有支持时测量长度与端点</text><text x="76" y="431" class="n">无依据的对应保留未定</text><rect x="512" y="314" width="436" height="144" rx="16" fill="white" stroke="#d2e0ec"/><rect x="512" y="334" width="5" height="102" rx="2" fill="#157c87"/><text x="536" y="354" class="t">04 共享片段</text><text x="536" y="396" class="p">允许一对多与多对一</text><text x="536" y="431" class="n">共同边不等于解剖身份</text><rect x="52" y="480" width="436" height="144" rx="16" fill="white" stroke="#d2e0ec"/><rect x="52" y="500" width="5" height="102" rx="2" fill="#157c87"/><text x="76" y="520" class="t">05 分叉簇</text><text x="76" y="562" class="p">单列簇内边与环路</text><text x="76" y="597" class="n">追查密集短链及残余</text><rect x="512" y="480" width="436" height="144" rx="16" fill="white" stroke="#d2e0ec"/><rect x="512" y="500" width="5" height="102" rx="2" fill="#157c87"/><text x="536" y="520" class="t">06 来源追溯</text><text x="536" y="562" class="p">分项核对身份、像素、空间</text><text x="536" y="597" class="n">来源绑定不等于HU闭合</text><rect x="52" y="663" width="896" height="70" rx="14" fill="#102e4a"/><text x="78" y="706" font-size="24" fill="white">输出：变化证据、对应支持与未解决问题分别列账</text></svg>