<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="从一次排障形成可复用技能"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43708f"/></marker></defs><rect width="1440" height="900" fill="#f5f8fb"/><g font-family="SimHei,Microsoft YaHei,sans-serif"><text x="72" y="85" font-size="24" letter-spacing="3" fill="#356283">ZIYIN  /  ENGINEERING RESEARCH</text><text x="72" y="156" font-size="44" font-weight="700" fill="#122c42">从一次排障形成可复用技能</text><text x="72" y="205" font-size="25" fill="#476074">拟议机制  ·  GPT辅助开发  ·  Flash独立复测  ·  结果由证据判断</text><rect x="72" y="264" width="378" height="208" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="98" y="304" font-size="21" fill="#367092">01  保留问题</text><text x="98" y="350" font-size="29" font-weight="700" fill="#17364d">故障与环境记录</text><text x="98" y="392" font-size="24" fill="#405b70">任务、配置、错误和回执</text><text x="98" y="428" font-size="24" fill="#405b70">原始文件与失败候选</text><rect x="531" y="264" width="378" height="208" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="557" y="304" font-size="21" fill="#367092">02  开发候选</text><text x="557" y="350" font-size="29" font-weight="700" fill="#17364d">GPT辅助分析与修复</text><text x="557" y="392" font-size="24" fill="#405b70">定位问题并修改候选</text><text x="557" y="428" font-size="24" fill="#405b70">明确适用条件与副作用</text><rect x="990" y="264" width="378" height="208" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="1016" y="304" font-size="21" fill="#367092">03  形成技能</text><text x="1016" y="350" font-size="29" font-weight="700" fill="#17364d">绑定真实接口与资源</text><text x="1016" y="392" font-size="24" fill="#405b70">输入输出和异常分支</text><text x="1016" y="428" font-size="24" fill="#405b70">版本、证据和测试样例</text><rect x="72" y="552" width="378" height="208" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="98" y="592" font-size="21" fill="#367092">06  允许复用</text><text x="98" y="638" font-size="29" font-weight="700" fill="#17364d">有范围的技能能力</text><text x="98" y="680" font-size="24" fill="#405b70">留出任务重复验证</text><text x="98" y="716" font-size="24" fill="#405b70">版本变化重新评估</text><rect x="531" y="552" width="378" height="208" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="557" y="592" font-size="21" fill="#367092">05  独立执行</text><text x="557" y="638" font-size="29" font-weight="700" fill="#17364d">Flash调用与结果核验</text><text x="557" y="680" font-size="24" fill="#405b70">GPT及人工不代操作</text><text x="557" y="716" font-size="24" fill="#405b70">失败计入评价并保留</text><rect x="990" y="552" width="378" height="208" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="1016" y="592" font-size="21" fill="#367092">04  验证候选</text><text x="1016" y="638" font-size="29" font-weight="700" fill="#17364d">回放与必要设备试验</text><text x="1016" y="680" font-size="24" fill="#405b70">先模拟异常和断线</text><text x="1016" y="716" font-size="24" fill="#405b70">再验证必要实体动作</text><path d="M450 370H516" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><path d="M909 370H975" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><path d="M1179 472V537" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><path d="M990 657H924" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><path d="M531 657H465" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><text x="72" y="831" font-size="24" fill="#476074">复测失败时返回问题记录与候选修复；形成文档本身不代表技能已部署。</text></g></svg>