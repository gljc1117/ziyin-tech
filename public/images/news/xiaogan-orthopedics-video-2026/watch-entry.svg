<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">孝感市中心医院骨科3D打印科普视频官方观看入口</title>
  <desc id="desc">深蓝色背景，左侧为视频标题，右侧为微信扫码观看二维码。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061330"/><stop offset=".58" stop-color="#0A2463"/><stop offset="1" stop-color="#075985"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1420 80) rotate(135) scale(720)"><stop stop-color="#22D3EE" stop-opacity=".35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#020617" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="102" cy="790" r="210" fill="none" stroke="#67E8F9" stroke-opacity=".08" stroke-width="42"/><circle cx="890" cy="118" r="120" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="30"/>
  <g font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="120" y="142" fill="#67E8F9" font-size="30" font-weight="700" letter-spacing="3">官方视频号 · 原片入口</text>
    <text x="120" y="292" fill="#FFFFFF" font-size="74" font-weight="700">骨科黑科技，</text><text x="120" y="398" fill="#FFFFFF" font-size="74" font-weight="700">3D打印深度科普</text>
    <rect x="120" y="462" width="112" height="5" rx="2.5" fill="#22D3EE"/>
    <text x="120" y="550" fill="#CBD5E1" font-size="34">发布账号：湖北省孝感市中心医院</text><text x="120" y="626" fill="#94A3B8" font-size="28">微信扫码或点击页面按钮观看医院官方原片</text>
    <text x="120" y="776" fill="#FFFFFF" fill-opacity=".72" font-size="25" letter-spacing="2">ZIYIN TECHNOLOGY · 子殷科技</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1257" cy="406" r="190" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="1257" cy="406" r="118" fill="#FFFFFF"/>
    <path d="M1224 340L1320 406L1224 472Z" fill="#0891B2"/>
    <text x="1257" y="648" text-anchor="middle" fill="#FFFFFF" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="700">查看医院官方原片</text>
  </g>
</svg>
