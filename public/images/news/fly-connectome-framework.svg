<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" fill="#f1f5f9"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="60" y="66" font-size="18" fill="#0369a1">子殷科技 · 医工观察 / RESEARCH REVIEW</text><text x="60" y="118" font-size="34" font-weight="700" fill="#0f172a">从结构到行为：三条研究路线，三轴验证</text><g fill="white" stroke="#cbd5e1"><rect x="60" y="166" width="340" height="180" rx="12"/><rect x="430" y="166" width="340" height="180" rx="12"/><rect x="800" y="166" width="340" height="180" rx="12"/></g><g fill="#0369a1" font-size="17"><text x="84" y="204">01 / 结构约束</text><text x="454" y="204">02 / 身体交互</text><text x="824" y="204">03 / 计算实现</text></g><g fill="#0f172a" font-size="28" font-weight="700"><text x="84" y="251">连接组</text><text x="454" y="251">物理身体仿真</text><text x="824" y="251">神经形态芯片</text></g><g fill="#475569" font-size="19"><text x="84" y="292">神经拓扑与数据来源</text><text x="454" y="292">运动、感觉与环境反馈</text><text x="824" y="292">精度、时序与部署成本</text><text x="84" y="321">需补充动力学与输入输出</text><text x="454" y="321">需分离学习与接口贡献</text><text x="824" y="321">需验证输出一致性</text></g><rect x="60" y="378" width="1080" height="104" rx="12" fill="#0f172a"/><text x="90" y="420" fill="white" font-size="25" font-weight="700">结构忠实度 × 功能有效性 × 实现一致性</text><text x="90" y="458" fill="#cbd5e1" font-size="18">本文提出的评价维度；不是实测指标，也不表示完整集成已获验证。</text><text x="60" y="516" fill="#64748b" font-size="15">示意图依据文献比较绘制。各路线的实验对象与证据边界见正文表1。</text></g></svg>