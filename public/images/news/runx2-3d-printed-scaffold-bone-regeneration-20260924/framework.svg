<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020"><rect width="1440" height="1020" rx="28" fill="#f3f7f8"/><text x="72" y="77" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="600" fill="#087d82">ZIYIN  /  BONE REGENERATION</text><text x="72" y="154" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="46" font-weight="700" fill="#18364a">让成骨信号进入可验证的修复过程</text><text x="72" y="205" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" font-weight="400" fill="#50677b">RUNX2 × 三维打印支架 · 概念研究框架</text><rect x="72" y="260" width="628" height="190" rx="18" fill="white" stroke="#d7e3e8" stroke-width="2"/><text x="102" y="309" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" font-weight="600" fill="#087d82">01  细胞与分子信号</text><text x="102" y="358" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="600" fill="#18364a">RUNX2作用于合适的细胞</text><text x="102" y="405" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#50677b">关注表达强度、位置与持续时间</text><rect x="740" y="260" width="628" height="190" rx="18" fill="white" stroke="#d7e3e8" stroke-width="2"/><text x="770" y="309" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" font-weight="600" fill="#087d82">02  支架与空间结构</text><text x="770" y="358" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="600" fill="#18364a">匹配缺损及组织长入路径</text><text x="770" y="405" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#50677b">核对孔隙、连通性和实物精度</text><rect x="72" y="485" width="628" height="190" rx="18" fill="white" stroke="#d7e3e8" stroke-width="2"/><text x="102" y="534" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" font-weight="600" fill="#087d82">03  血管与局部环境</text><text x="102" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="600" fill="#18364a">考察中央区域的供血能力</text><text x="102" y="630" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#50677b">血管标志物需结合灌注评价</text><rect x="740" y="485" width="628" height="190" rx="18" fill="white" stroke="#d7e3e8" stroke-width="2"/><text x="770" y="534" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" font-weight="600" fill="#087d82">04  力学与组织成熟</text><text x="770" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="600" fill="#18364a">连接宿主骨并逐步承担负荷</text><text x="770" y="630" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#50677b">关注固定、成熟、降解与重塑</text><rect x="72" y="730" width="1296" height="170" rx="18" fill="#123c51"/><text x="105" y="787" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" font-weight="700" fill="#ffffff">共同接受验证</text><text x="105" y="843" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" font-weight="400" fill="#ffffff">缺损桥接  ·  组织成熟  ·  力学恢复  ·  作用范围与安全</text><text x="72" y="967" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="400" fill="#50677b">原创概念图｜组合方案仍需对照试验，不表示已证实的联合疗效</text></svg>