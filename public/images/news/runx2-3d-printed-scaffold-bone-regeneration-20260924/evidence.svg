<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020"><rect width="1440" height="1020" rx="28" fill="#f3f7f8"/><text x="72" y="77" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="600" fill="#087d82">ZIYIN  /  EVIDENCE FRAMEWORK</text><text x="72" y="150" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="43" font-weight="700" fill="#18364a">长出骨与修好骨需要不同层次的证据</text><text x="72" y="200" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="400" fill="#50677b">评价逐层推进；不同层次的证据不能互相替代</text><rect x="72" y="246" width="1296" height="122" rx="15" fill="white" stroke="#d7e3e8"/><text x="100" y="298" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="35" font-weight="700" fill="#087d82">01</text><text x="185" y="297" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" fill="#18364a">分子与细胞</text><text x="185" y="338" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="400" fill="#50677b">表达时程、细胞活性与分化反应</text><text x="974" y="317" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#926232">不等于组织已形成</text><rect x="72" y="389" width="1296" height="122" rx="15" fill="white" stroke="#d7e3e8"/><text x="100" y="441" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="35" font-weight="700" fill="#087d82">02</text><text x="185" y="440" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" fill="#18364a">组织与血供</text><text x="185" y="481" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="400" fill="#50677b">新生骨组织、成熟程度与实际灌注</text><text x="974" y="460" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#926232">不等于缺损已连通</text><rect x="72" y="532" width="1296" height="122" rx="15" fill="white" stroke="#d7e3e8"/><text x="100" y="584" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="35" font-weight="700" fill="#087d82">03</text><text x="185" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" fill="#18364a">结构与界面</text><text x="185" y="624" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="400" fill="#50677b">缺损桥接、宿主骨结合与材料区分</text><text x="974" y="603" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#926232">不等于承重已恢复</text><rect x="72" y="675" width="1296" height="122" rx="15" fill="white" stroke="#d7e3e8"/><text x="100" y="727" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="35" font-weight="700" fill="#087d82">04</text><text x="185" y="726" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" fill="#18364a">功能与持久性</text><text x="185" y="767" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="400" fill="#50677b">目标负荷下力学表现及长期重塑</text><text x="974" y="746" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#926232">不等于人体疗效已证实</text><rect x="72" y="848" width="1296" height="73" rx="15" fill="#e1f0ee"/><text x="106" y="895" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" font-weight="600" fill="#12625c">贯穿各层的检查：局部炎症、异常组织、缺损外成骨及必要的全身评价</text><text x="72" y="978" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="400" fill="#50677b">原创评价框架｜概念示意，不含实验数据或效果量</text></svg>