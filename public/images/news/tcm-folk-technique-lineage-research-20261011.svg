<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">中医民间技术的数字化传承研究框架</title><desc id="desc">三个信息来源连接到知识主张，并分别建立四个验证域的记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8992"/></marker></defs><rect width="1440" height="1080" fill="#f8fbfc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="72" y="82" font-size="44" fill="#203b48" font-weight="700" text-anchor="start">中医民间技术：从传承记录到可研究的知识</text><text x="74" y="128" font-size="26" fill="#5a727e" font-weight="400" text-anchor="start">方法框架  ·  先记录来源与条件，再回答不同层面的研究问题</text><rect x="72" y="190" width="396" height="178" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="98" y="238" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">传承事件</text><text x="98" y="281" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">谁向谁传授</text><text x="98" y="316" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">方式、时间与来源</text><rect x="522" y="190" width="396" height="178" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="548" y="238" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">技术版本</text><text x="548" y="281" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">实际传授了什么</text><text x="548" y="316" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">沿用、变化与并行变体</text><rect x="972" y="190" width="396" height="178" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="998" y="238" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">诊疗决策事件</text><text x="998" y="281" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">当时如何判断和行动</text><text x="998" y="316" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">实际信息、调整与停止</text><path d="M 270 368 L 270 410 L 510 410 L 510 451" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><path d="M 720 368 L 720 451" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1170 368 L 1170 410 L 930 410 L 930 451" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><rect x="322" y="452" width="796" height="166" rx="18" fill="#e0efed" stroke="#79a79e" stroke-width="2"/><text x="348" y="500" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">知识主张</text><text x="348" y="543" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">限定情境与命题  ·  连接原文、反例和候选规则</text><text x="348" y="578" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">保留提出者、证据状态与修订版本</text><text x="720" y="667" font-size="27" fill="#42695f" font-weight="600" text-anchor="middle">分别建立验证记录，结论不自动升级</text><rect x="72" y="708" width="620" height="118" rx="18" fill="#fff" stroke="#b9cbd0" stroke-width="2"/><text x="98" y="756" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">语义来源</text><text x="98" y="799" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">资料可信、表达忠实</text><rect x="748" y="708" width="620" height="118" rx="18" fill="#fff" stroke="#b9cbd0" stroke-width="2"/><text x="774" y="756" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">测量工程</text><text x="774" y="799" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">变量可靠、规则执行一致</text><rect x="72" y="852" width="620" height="118" rx="18" fill="#fff" stroke="#b9cbd0" stroke-width="2"/><text x="98" y="900" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">研究命题</text><text x="98" y="943" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">指定判断或技术的证据</text><rect x="748" y="852" width="620" height="118" rx="18" fill="#fff" stroke="#b9cbd0" stroke-width="2"/><text x="774" y="900" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">实际获益</text><text x="774" y="943" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">真实用途中的收益与代价</text><text x="74" y="1030" font-size="24" fill="#647c87" font-weight="400" text-anchor="start">方法示意，无实测结果。四域可并行或反复评价；各自保留对象、版本和局限。</text></g></svg>