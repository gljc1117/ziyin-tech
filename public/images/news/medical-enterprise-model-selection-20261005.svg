<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">医疗企业大模型选型：从预期用途到可验证交付</title>
  <desc id="desc">拟议方法框架。明确任务后检查必要条件，分层评价模型、RAG系统与人机协作，依据质量、时间及成本形成选择，并通过版本复评持续改进。不是实验结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#46748d" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f5f8fa"/>
