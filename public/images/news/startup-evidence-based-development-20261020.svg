<rect x="64" y="689" width="1072" height="67" rx="14" fill="#dfe7f2"/>
<text x="600" y="732" text-anchor="middle" font-size="24" fill="#27486b">阶段决策：继续、调整、暂停或终止；差异与失败反馈至日常记录</text>
<text x="64" y="790" font-size="17" fill="#60748c">共享事实允许形成不同专业视图；图示不替代会计核算、政策判断或实际验证。</text>
