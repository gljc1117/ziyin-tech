<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">共同事实连接企业发展</title><desc id="desc">研发、财务、人事和业务依据真实事件与来源形成不同专业视图，连接证据与阶段决策。差异解释和失败复盘返回日常记录。属于拟议框架。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4e6d9c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" rx="24" fill="#f3f5fa"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
