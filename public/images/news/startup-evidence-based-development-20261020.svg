<g font-size="24" fill="#213853" font-weight="700"><text x="93" y="269">研发</text><text x="662" y="269">财务</text><text x="93" y="594">人事</text><text x="662" y="594">业务</text></g>
<g font-size="21" fill="#5c6e84"><text x="177" y="269">问题、方案、试验与结果</text><text x="746" y="269">凭证、期间与分类依据</text><text x="177" y="594">岗位、参与与工作安排</text><text x="746" y="594">需求、交付与应用反馈</text></g>
<rect x="215" y="359" width="770" height="126" rx="20" fill="#27486b"/>
