<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI建造科学仪器：可检验的研究循环</title>
  <desc id="desc">定义问题、建立仪器、执行实验与独立验证；验证结果反馈下一轮。子殷科技原创概念示意，不含实验数据。</desc>
  <rect width="1200" height="630" fill="#f1f5f9"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1d4ed8"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="78" font-size="25" fill="#1d4ed8">子殷科技 · 医工观察</text>
    <text x="64" y="149" font-size="46" font-weight="700" fill="#0f172a">当AI开始建造科学仪器</text>
    <text x="64" y="201" font-size="26" fill="#475569">工具、实验与证据，如何支持下一轮研究</text>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="2">
      <rect x="64" y="260" width="242" height="145" rx="12"/>
      <rect x="341" y="260" width="242" height="145" rx="12"/>
      <rect x="618" y="260" width="242" height="145" rx="12"/>
      <rect x="895" y="260" width="242" height="145" rx="12"/>
    </g>
    <g font-size="31" font-weight="700" fill="#0f172a">
      <text x="91" y="318">定义问题</text><text x="368" y="318">建立仪器</text>
      <text x="645" y="318">执行实验</text><text x="922" y="318">独立验证</text>
    </g>
    <g font-size="23" fill="#475569">
      <text x="91" y="365">表示与适用条件</text><text x="368" y="365">程序与数值检查</text>
      <text x="645" y="365">预测与完整记录</text><text x="922" y="365">对照与外部测量</text>
    </g>
    <g stroke="#1d4ed8" stroke-width="3" fill="none">
      <path d="M309 333H333m-8-7 8 7-8 7M586 333H610m-8-7 8 7-8 7M863 333H887m-8-7 8 7-8 7"/>
      <path d="M1016 409V463H185V416m-8 9 8-9 8 9"/>
    </g>
    <text x="600" y="515" text-anchor="middle" font-size="28" font-weight="700" fill="#1e40af">保留有效工具与失败经验 · 在新任务上检验收益</text>
    <text x="64" y="587" font-size="22" fill="#64748b">概念示意｜无实验数据</text>
  </g>
</svg>
