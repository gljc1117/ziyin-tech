<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="医学影像预训练：从24篇文献到专科交付"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#278b91"/></marker></defs><rect width="1500" height="900" fill="#f3f7fb"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#153451"><text x="90" y="105" font-size="24" fill="#278b91" font-weight="700">ZIYIN  /  文献研究与研发方法</text><text x="90" y="185" font-size="65" fill="#153451" font-weight="700">医学影像预训练</text><text x="90" y="239" font-size="36" fill="#526a7d" font-weight="400">从24篇论文证据，走向可审阅的专科交付</text><rect x="90" y="295" width="635" height="175" rx="22" fill="white" stroke="#d7e3ed"/><rect x="90" y="318" width="6" height="129" rx="3" fill="#278b91"/><text x="118" y="344" font-size="31" fill="#153451" font-weight="700">影像表征与数据</text><text x="118" y="386" font-size="24" fill="#526a7d" font-weight="400">三维上下文 · 自监督 · 修订资料</text><text x="118" y="420" font-size="24" fill="#526a7d" font-weight="400">先建立目标与可靠基线</text><rect x="775" y="295" width="635" height="175" rx="22" fill="white" stroke="#d7e3ed"/><rect x="775" y="318" width="6" height="129" rx="3" fill="#278b91"/><text x="803" y="344" font-size="31" fill="#153451" font-weight="700">图文、知识与时间</text><text x="803" y="386" font-size="24" fill="#526a7d" font-weight="400">报告关联 · 概念对齐 · 前后检查</text><text x="803" y="420" font-size="24" fill="#526a7d" font-weight="400">语义能力与几何能力分别验证</text><rect x="90" y="510" width="635" height="175" rx="22" fill="white" stroke="#d7e3ed"/><rect x="90" y="533" width="6" height="129" rx="3" fill="#278b91"/><text x="118" y="559" font-size="31" fill="#153451" font-weight="700">可交互的候选分割</text><text x="118" y="601" font-size="24" fill="#526a7d" font-weight="400">框选 · 局部修订 · 边界检查</text><text x="118" y="635" font-size="24" fill="#526a7d" font-weight="400">工程师确认后保存版本</text><rect x="775" y="510" width="635" height="175" rx="22" fill="white" stroke="#d7e3ed"/><rect x="775" y="533" width="6" height="129" rx="3" fill="#278b91"/><text x="803" y="559" font-size="31" fill="#153451" font-weight="700">独立评价与任务组织</text><text x="803" y="601" font-size="24" fill="#526a7d" font-weight="400">适用范围 · 失败记录 · 人员时间</text><text x="803" y="635" font-size="24" fill="#526a7d" font-weight="400">SI连接算法、审阅和交付</text><text x="90" y="766" font-size="37" fill="#153451" font-weight="700">数字成果独立交付</text><text x="90" y="815" font-size="28" fill="#526a7d" font-weight="400">按医嘱与任务要求，继续进入实体制造；每一步保留证据。</text><text x="90" y="866" font-size="21" fill="#72899a" font-weight="400">原创方法示意  ·  2026.10  ·  不代表已取得实验或临床效果</text></g></svg>