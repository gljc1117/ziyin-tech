<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-label="三维服务质量：分割、网格与制造分别评价"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#278b91"/></marker></defs><rect width="1500" height="820" fill="#f3f7fb"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#153451"><text x="70" y="100" font-size="52" fill="#153451" font-weight="700">三个层次，各自建立证据</text><text x="70" y="156" font-size="29" fill="#526a7d" font-weight="400">外观平滑，不能单独证明结构完整或几何准确。</text><rect x="60" y="230" width="425" height="320" rx="22" fill="white" stroke="#d7e3ed"/><rect x="60" y="253" width="6" height="274" rx="3" fill="#278b91"/><text x="88" y="279" font-size="31" fill="#153451" font-weight="700">01  分割</text><text x="88" y="321" font-size="24" fill="#526a7d" font-weight="400">目标集合与侧别</text><text x="88" y="355" font-size="24" fill="#526a7d" font-weight="400">小碎片和结构遗漏</text><text x="88" y="389" font-size="24" fill="#526a7d" font-weight="400">错误粘连与边界</text><text x="88" y="423" font-size="24" fill="#526a7d" font-weight="400">区域及表面指标</text><rect x="535" y="230" width="425" height="320" rx="22" fill="white" stroke="#d7e3ed"/><rect x="535" y="253" width="6" height="274" rx="3" fill="#278b91"/><text x="563" y="279" font-size="31" fill="#153451" font-weight="700">02  网格与显示</text><text x="563" y="321" font-size="24" fill="#526a7d" font-weight="400">坐标、单位和连通分量</text><text x="563" y="355" font-size="24" fill="#526a7d" font-weight="400">处理前后的几何变化</text><text x="563" y="389" font-size="24" fill="#526a7d" font-weight="400">孔洞、法线与显示</text><text x="563" y="423" font-size="24" fill="#526a7d" font-weight="400">相对变化与真值误差分开</text><rect x="1010" y="230" width="425" height="320" rx="22" fill="white" stroke="#d7e3ed"/><rect x="1010" y="253" width="6" height="274" rx="3" fill="#278b91"/><text x="1038" y="279" font-size="31" fill="#153451" font-weight="700">03  实体制造</text><text x="1038" y="321" font-size="24" fill="#526a7d" font-weight="400">切片方向与工艺参数</text><text x="1038" y="355" font-size="24" fill="#526a7d" font-weight="400">材料与打印过程</text><text x="1038" y="389" font-size="24" fill="#526a7d" font-weight="400">实物尺寸及检查记录</text><text x="1038" y="423" font-size="24" fill="#526a7d" font-weight="400">制造质量独立核对</text><path d="M 490 390 L 524 390" fill="none" stroke="#278b91" stroke-width="5" marker-end="url(#a)"/><path d="M 966 390 L 1000 390" fill="none" stroke="#278b91" stroke-width="5" marker-end="url(#a)"/><rect x="60" y="610" width="1375" height="130" rx="20" fill="#dff0ee"/><text x="90" y="661" font-size="33" fill="#153451" font-weight="700">共同保留：输入、版本、参数、修改、审核与产物关联</text><text x="90" y="707" font-size="25" fill="#526a7d" font-weight="400">一个环节的改善，不自动证明其他环节正确。图为评价设计，不含病例结果。</text></g></svg>