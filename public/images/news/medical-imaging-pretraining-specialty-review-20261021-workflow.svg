<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-label="拟议的chcomct SI专科审阅与交付流程"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#278b91"/></marker></defs><rect width="1500" height="1020" fill="#f3f7fb"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#153451"><text x="70" y="96" font-size="50" fill="#153451" font-weight="700">SI把已验证能力组织成可审阅流程</text><text x="70" y="153" font-size="28" fill="#526a7d" font-weight="400">任务、算法、审核和交付相互关联；流程效果需另行验证。</text><rect x="60" y="220" width="410" height="160" rx="22" fill="white" stroke="#d7e3ed"/><rect x="60" y="243" width="6" height="114" rx="3" fill="#278b91"/><text x="88" y="269" font-size="31" fill="#153451" font-weight="700">任务定义</text><text x="88" y="311" font-size="24" fill="#526a7d" font-weight="400">部位 · 侧别 · 目标</text><text x="88" y="345" font-size="24" fill="#526a7d" font-weight="400">用途 · 交付要求</text><rect x="545" y="220" width="410" height="160" rx="22" fill="white" stroke="#d7e3ed"/><rect x="545" y="243" width="6" height="114" rx="3" fill="#278b91"/><text x="573" y="269" font-size="31" fill="#153451" font-weight="700">算法初稿</text><text x="573" y="311" font-size="24" fill="#526a7d" font-weight="400">选择适配范围内的候选</text><text x="573" y="345" font-size="24" fill="#526a7d" font-weight="400">保存参数、版本及输出</text><rect x="1030" y="220" width="410" height="160" rx="22" fill="white" stroke="#d7e3ed"/><rect x="1030" y="243" width="6" height="114" rx="3" fill="#278b91"/><text x="1058" y="269" font-size="31" fill="#153451" font-weight="700">专科审阅</text><text x="1058" y="311" font-size="24" fill="#526a7d" font-weight="400">检查完整性与几何</text><text x="1058" y="345" font-size="24" fill="#526a7d" font-weight="400">修订、记录差异</text><path d="M 477 300 L 533 300" fill="none" stroke="#278b91" stroke-width="5" marker-end="url(#a)"/><path d="M 962 300 L 1018 300" fill="none" stroke="#278b91" stroke-width="5" marker-end="url(#a)"/><rect x="545" y="475" width="410" height="140" rx="22" fill="white" stroke="#d7e3ed"/><rect x="545" y="498" width="6" height="94" rx="3" fill="#278b91"/><text x="573" y="524" font-size="31" fill="#153451" font-weight="700">必要审核</text><text x="573" y="566" font-size="24" fill="#526a7d" font-weight="400">确认目标、结果与用途</text><path d="M 1235 388 L 1235 433 L 750 433 L 750 463" fill="none" stroke="#278b91" stroke-width="5" marker-end="url(#a)"/><rect x="60" y="715" width="410" height="150" rx="22" fill="white" stroke="#d7e3ed"/><rect x="60" y="738" width="6" height="104" rx="3" fill="#278b91"/><text x="88" y="764" font-size="31" fill="#153451" font-weight="700">数字成果交付</text><text x="88" y="806" font-size="24" fill="#526a7d" font-weight="400">审定模型 · 测量 · 报告</text><text x="88" y="840" font-size="24" fill="#526a7d" font-weight="400">按任务保存与交接</text><rect x="1030" y="715" width="410" height="150" rx="22" fill="white" stroke="#d7e3ed"/><rect x="1030" y="738" width="6" height="104" rx="3" fill="#278b91"/><text x="1058" y="764" font-size="31" fill="#153451" font-weight="700">按需实体制造</text><text x="1058" y="806" font-size="24" fill="#526a7d" font-weight="400">任务包含打印时继续</text><text x="1058" y="840" font-size="24" fill="#526a7d" font-weight="400">切片 · 打印 · 实物核对</text><path d="M 750 622 L 750 660 L 265 660 L 265 703" fill="none" stroke="#278b91" stroke-width="5" marker-end="url(#a)"/><path d="M 750 660 L 1235 660 L 1235 703" fill="none" stroke="#278b91" stroke-width="5" marker-end="url(#a)"/><rect x="60" y="909" width="1380" height="75" rx="18" fill="#dff0ee"/><text x="90" y="957" font-size="29" fill="#153451" font-weight="500">经确认的修改形成候选学习资料；开发资料与独立评价集分开管理。</text></g></svg>