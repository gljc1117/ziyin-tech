<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">创业公司如何培养组织理性</title><desc id="desc">本文概念框架：暴露不确定性，核对证据与判断，根据反馈修正规则。六项机制支持持续纠错，效果有待实践检验。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef7ff"/><stop offset="1" stop-color="#e9f7f4"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#558094" stroke-width="1.5"/></marker></defs>
<rect width="1500" height="900" rx="28" fill="url(#bg)"/>
<path d="M70 65H1430" stroke="#9fb9c9"/><text x="76" y="112" fill="#355e75" font-family="sans-serif" font-size="24" letter-spacing="3">ZIYIN INSIGHTS · 组织管理研究</text>
<text x="75" y="221" fill="#15374e" font-family="sans-serif" font-weight="700" font-size="68">创业公司的组织理性</text>
<text x="78" y="278" fill="#45687c" font-family="sans-serif" font-size="29">从创始人判断，到可持续纠错的决策机制</text>
<g font-family="sans-serif">
<rect x="75" y="351" width="420" height="281" rx="20" fill="#fff" stroke="#c8dbe6"/>
<text x="104" y="399" font-size="22" fill="#62859b">01 · 暴露不确定性</text><text x="104" y="464" font-size="38" font-weight="700" fill="#15374e">允许“不知道”</text><text x="104" y="525" font-size="25" fill="#4e6a7b">及时提出疑问</text><text x="104" y="568" font-size="25" fill="#4e6a7b">给核实问题提供支持</text>
<rect x="540" y="351" width="420" height="281" rx="20" fill="#fff" stroke="#c8dbe6"/>
<text x="569" y="399" font-size="22" fill="#62859b">02 · 核对证据与判断</text><text x="569" y="464" font-size="38" font-weight="700" fill="#15374e">区分意见与结论</text><text x="569" y="525" font-size="25" fill="#4e6a7b">保留依据与适用范围</text><text x="569" y="568" font-size="25" fill="#4e6a7b">让专业意见影响决定</text>
<rect x="1005" y="351" width="420" height="281" rx="20" fill="#fff" stroke="#c8dbe6"/>
<text x="1034" y="399" font-size="22" fill="#62859b">03 · 根据反馈修正</text><text x="1034" y="464" font-size="38" font-weight="700" fill="#15374e">错误后修改规则</text><text x="1034" y="525" font-size="25" fill="#4e6a7b">检查原有假设与流程</text><text x="1034" y="568" font-size="25" fill="#4e6a7b">在下一次工作中验证</text>
<path d="M495 491H530" fill="none" stroke="#558094" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M960 491H995" fill="none" stroke="#558094" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1215 644V680H285V645" fill="none" stroke="#558094" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="555" y="655" width="390" height="48" rx="24" fill="#e9f7f4"/><text x="750" y="687" text-anchor="middle" font-size="24" fill="#326e68">后续结果反馈，持续修正</text>
<text x="750" y="766" text-anchor="middle" font-size="26" fill="#355e75">管理者示范 · 专业核对 · 风险分级授权 · 激励协调 · 复盘转化 · 经验复用</text>
<text x="75" y="842" font-size="23" fill="#355e75">瑜秀瞳芯 / 子殷科技</text><text x="1425" y="842" text-anchor="end" font-size="21" fill="#62859b">本文概念框架 · 待实践检验</text>
</g></svg>