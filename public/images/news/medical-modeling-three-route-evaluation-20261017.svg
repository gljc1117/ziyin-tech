<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">同一CT三路线配对评价方案</title>
<desc id="desc">相同输入分到人工、自动和专科模型三路线，各自记录初稿、修订稿和导出稿。用独立参考比较，固定参数重放与统一后处理分别用于定位执行和算法差异。方案尚未执行。</desc>
