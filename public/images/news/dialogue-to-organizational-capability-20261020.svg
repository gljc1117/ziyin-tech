<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">从一次需求到可复用方法</title><desc id="desc">用户价值进入设计约束，再转为参数规则，经证据核验形成有适用边界的方法。新任务中的变化和失败反馈到规则与需求。属于拟议框架。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#267d87" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" rx="24" fill="#f2f7f6"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
<text x="64" y="67" font-size="19" letter-spacing="3" fill="#36737b">ZIYIN · 方法研究</text>
<text x="64" y="127" font-size="40" font-weight="700" fill="#163d46">从一次需求到可复用方法</text>
<text x="64" y="169" font-size="22" fill="#526f75">让价值判断、工程规则和验证证据保持对应</text>
<g fill="white" stroke="#c4d9d8" stroke-width="2">
<rect x="64" y="218" width="500" height="174" rx="18"/>
<rect x="636" y="218" width="500" height="174" rx="18"/>
<rect x="64" y="454" width="500" height="174" rx="18"/>
<rect x="636" y="454" width="500" height="174" rx="18"/>
</g>
<g fill="#267d87" font-size="18" font-weight="700"><text x="92" y="254">01 / 价值与情境</text><text x="664" y="254">02 / 规则与参数</text><text x="664" y="490">03 / 证据与边界</text><text x="92" y="490">04 / 接手与复用</text></g>
<g fill="#163d46" font-size="29" font-weight="700"><text x="92" y="300">使用者需要什么</text><text x="664" y="300">哪些变化可以被执行</text><text x="664" y="536">结果支持什么结论</text><text x="92" y="536">其他成员能否继续使用</text></g>
<g fill="#526f75" font-size="22"><text x="92" y="346">交付、长期收纳、体验与制造约束</text><text x="664" y="346">尺寸、结构、文字、时限和例外</text><text x="664" y="582">数字检查、实物验证、未完成事项</text><text x="92" y="582">适用条件、维护责任与贡献记录</text></g>
<g fill="none" stroke="#267d87" stroke-width="3" marker-end="url(#arrow)"><path d="M570 305H626"/><path d="M886 400V442"/><path d="M627 541H575"/><path d="M314 444V405" stroke-dasharray="7 6"/></g>
<rect x="64" y="681" width="1072" height="75" rx="15" fill="#dcece8"/>
<text x="91" y="726" font-size="23" fill="#24575d">反馈：新任务中的变化与失败，推动需求、规则和证据更新</text>
<text x="64" y="790" font-size="17" fill="#607b80">箭头表示拟议工作关系；有效性需要后续任务与实物评价检验。</text>
</g></svg>
