<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CT基础模型与可审核医工协同</title>
<desc id="desc">概念研究框架。既有CT分为候选临床信息与几何处理两条路径，汇入专业审核，之后按需形成报告、规划文件或制造任务。</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071e38"/><stop offset="1" stop-color="#0c344b"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#6ebad1" stroke-width="1.5"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <text x="92" y="88" fill="#7ee4db" font-size="25" letter-spacing="3">子殷科技  ·  研究观点</text>
  <text x="92" y="158" fill="white" font-size="48" font-weight="700">从影像信息，到可审核的医工任务</text>
  <text x="94" y="207" fill="#afcadb" font-size="25">CT基础模型 × 三维重建 × 按需交付</text>
  <g fill="#123b55" stroke="#39617a" stroke-width="2">
    <rect x="90" y="337" width="285" height="210" rx="20"/>
    <rect x="492" y="272" width="390" height="140" rx="20"/>
    <rect x="492" y="473" width="390" height="140" rx="20"/>
    <rect x="1000" y="337" width="505" height="210" rx="20" fill="#124755" stroke="#62d6c6"/>
  </g>
  <g fill="none" stroke="#6ebad1" stroke-width="3" marker-end="url(#arrow)">
    <path d="M375 411 H430 V342 H476"/><path d="M375 475 H430 V543 H476"/>
    <path d="M882 342 H940 V407 H984"/><path d="M882 543 H940 V477 H984"/>
    <path d="M1253 547 V654"/>
  </g>
  <text x="126" y="391" fill="#7ee4db" font-size="21">INPUT</text>
  <text x="126" y="441" fill="white" font-size="34" font-weight="700">既有 CT</text>
  <text x="126" y="485" fill="#c2d8e6" font-size="23">来源 · 质量 · 适用条件</text>
  <text x="529" y="321" fill="#7ee4db" font-size="21">候选临床信息</text>
  <text x="529" y="365" fill="white" font-size="28">表征、任务分数、不确定性</text>
  <text x="529" y="522" fill="#7ee4db" font-size="21">几何处理</text>
  <text x="529" y="566" fill="white" font-size="28">分割、测量、三维重建</text>
  <text x="1041" y="392" fill="#7ee4db" font-size="21">REVIEW</text>
  <text x="1041" y="444" fill="white" font-size="34" font-weight="700">专业审核与任务确认</text>
  <text x="1041" y="490" fill="#d4e5eb" font-size="24">接受 · 修改 · 退回 · 停止</text>
  <rect x="1000" y="674" width="505" height="98" rx="16" fill="#edf9f6"/>
  <text x="1040" y="714" fill="#0c4b4a" font-size="27" font-weight="700">按需交付</text>
  <text x="1040" y="750" fill="#285b65" font-size="22">报告 · 规划文件 · 制造与实物检查</text>
  <text x="92" y="714" fill="#d0e5ef" font-size="26">关键研究问题</text>
  <text x="92" y="757" fill="#a8c8d9" font-size="25">结果是否可靠？  审核是否有效？  交付能否追溯？</text>
  <path d="M90 812 H1505" stroke="#39617a"/>
  <text x="92" y="854" fill="#a8c8d9" font-size="20">基于 Percival 研究的转化分析 · 原创概念示意 · 非现有产品界面，非临床效果证明</text>
</g>
</svg>
