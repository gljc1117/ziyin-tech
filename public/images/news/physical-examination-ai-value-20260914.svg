<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">医疗AI的价值验证</title><desc id="desc">技术性能、决策影响与患者获益需要分别评价。这是本文提出的评价框架，不是临床研究结果。</desc><rect width="1200" height="540" fill="#0a1938"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="64" y="83" fill="#6ee7f2" font-size="22">子殷科技 · 医工观察</text><text x="64" y="149" fill="white" font-size="40" font-weight="700">医疗AI的价值验证</text><g fill="#11294b" stroke="#416784" stroke-width="2"><rect x="64" y="208" width="308" height="192" rx="12"/><rect x="446" y="208" width="308" height="192" rx="12"/><rect x="828" y="208" width="308" height="192" rx="12"/></g><g fill="white" font-size="30" font-weight="700" text-anchor="middle"><text x="218" y="271">技术性能</text><text x="600" y="271">决策影响</text><text x="982" y="271">患者获益</text></g><g fill="#c0d5e7" font-size="22" text-anchor="middle"><text x="218" y="323">准确性与可靠性</text><text x="218" y="361">在哪些人群中成立</text><text x="600" y="323">是否改变合理处理</text><text x="600" y="361">复核与后续工作量</text><text x="982" y="323">结局改善与潜在伤害</text><text x="982" y="361">实际净获益</text></g><g stroke="#6ee7f2" stroke-width="3" fill="none"><path d="M386 304h43m-11-10 11 10-11 10"/><path d="M768 304h43m-11-10 11 10-11 10"/></g><text x="64" y="473" fill="#bdd0e4" font-size="21">分别验证每个层次，不能由技术指标直接推定临床获益</text><text x="64" y="511" fill="#859eb8" font-size="17">本文提出的评价框架 · 非临床研究结果</text></g></svg>