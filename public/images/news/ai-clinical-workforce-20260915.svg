<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="24" fill="#0f2338"/><g font-family="sans-serif"><text x="70" y="85" fill="#6ee7c3" font-size="23">子殷科技 · 医工观察</text><text x="70" y="150" fill="white" font-size="42" font-weight="700">AI时代，医生的工作如何改变？</text><text x="70" y="200" fill="#b9cadd" font-size="25">从效率提升到岗位重构</text><rect x="70" y="250" width="300" height="150" rx="16" fill="#183c52"/><rect x="450" y="250" width="300" height="150" rx="16" fill="#183c52"/><rect x="830" y="250" width="300" height="150" rx="16" fill="#183c52"/><g fill="white" font-size="30" text-anchor="middle"><text x="220" y="306">单次任务</text><text x="600" y="306">每日工作</text><text x="980" y="306">岗位需求</text></g><g fill="#b9cadd" font-size="22" text-anchor="middle"><text x="220" y="357">操作、复核与返工</text><text x="600" y="357">服务量与时间分配</text><text x="980" y="357">分工、培训与新任务</text></g><g fill="#6ee7c3" font-size="40"><text x="391" y="338">→</text><text x="771" y="338">→</text></g><text x="70" y="470" fill="#b9cadd" font-size="22">三个层级需要分别评价，任务省时不能直接推导减员比例。</text></g></svg>