<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="设备执行与应用识别分别记录"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43708f"/></marker></defs><rect width="1440" height="900" fill="#f5f8fb"/><g font-family="SimHei,Microsoft YaHei,sans-serif"><text x="72" y="85" font-size="24" letter-spacing="3" fill="#356283">ZIYIN  /  ENGINEERING RESEARCH</text><text x="72" y="156" font-size="44" font-weight="700" fill="#122c42">设备执行与应用识别分别记录</text><text x="72" y="205" font-size="25" fill="#476074">拟议处理分支  ·  对应案例中的 JOB_NAME_MISMATCH</text><rect x="72" y="270" width="535" height="190" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="98" y="310" font-size="21" fill="#367092">输入  A</text><text x="98" y="356" font-size="29" font-weight="700" fill="#17364d">设备证据</text><text x="98" y="398" font-size="24" fill="#405b70">任务状态为打印中</text><text x="98" y="434" font-size="24" fill="#405b70">记录设备任务标识与观测时间</text><rect x="833" y="270" width="535" height="190" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="859" y="310" font-size="21" fill="#367092">输入  B</text><text x="859" y="356" font-size="29" font-weight="700" fill="#17364d">应用证据</text><text x="859" y="398" font-size="24" fill="#405b70">未观察到预期回执</text><text x="859" y="434" font-size="24" fill="#405b70">记录不匹配原因与原始名称</text><rect x="410" y="520" width="620" height="175" rx="18" fill="white" stroke="#b7cbd9" stroke-width="2"/><text x="436" y="560" font-size="21" fill="#367092">核验</text><text x="436" y="606" font-size="29" font-weight="700" fill="#17364d">关联设备与提交记录</text><text x="436" y="648" font-size="24" fill="#405b70">结合任务标识、文件摘要与时间</text><path d="M338 460V490H590V505" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><path d="M1100 460V490H850V505" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><rect x="72" y="756" width="600" height="91" rx="15" fill="#e5f0ed"/><text x="99" y="794" font-size="25" fill="#234c40">关联成立</text><text x="99" y="828" font-size="23" fill="#234c40">更新识别状态  持续观察  不重复下发</text><rect x="768" y="756" width="600" height="91" rx="15" fill="#fff0dc"/><text x="795" y="794" font-size="25" fill="#72512b">仍有歧义</text><text x="795" y="828" font-size="23" fill="#72512b">保留待核验状态  暂停自动再次下发</text><path d="M590 695V723H375V741" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/><path d="M850 695V723H1058V741" fill="none" stroke="#43708f" stroke-width="3" marker-end="url(#a)"/></g></svg>