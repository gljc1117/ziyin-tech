<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2748"/>
      <stop offset="1" stop-color="#0e4d64"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="105" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff">生物打印的门槛被拉低了</text>
  <text x="70" y="160" font-family="sans-serif" font-size="27" fill="#bcd9e8">450美元开源改装方案：罗彻斯特大学与康奈尔大学</text>
  <g font-family="sans-serif">
    <rect x="150" y="225" width="900" height="72" rx="10" fill="#123f63" stroke="#7fb6cf" stroke-width="2"/>
    <text x="190" y="272" font-size="28" font-weight="bold" fill="#ffffff">改装廉价打印机，挤出头换成注射器加泵</text>
    <rect x="150" y="320" width="900" height="72" rx="10" fill="#123f63" stroke="#7fb6cf" stroke-width="2"/>
    <text x="190" y="367" font-size="28" font-weight="bold" fill="#ffffff">从约20层到100层以上，还能打空腔</text>
    <rect x="150" y="415" width="900" height="72" rx="10" fill="#123f63" stroke="#7fb6cf" stroke-width="2"/>
    <text x="190" y="462" font-size="28" font-weight="bold" fill="#ffffff">开放获取发表，改装图纸已开源</text>
  </g>
  <text x="70" y="565" font-family="sans-serif" font-size="22" fill="#bcd9e8">子殷科技 · 研究述评与方法探索 · 2026年11月18日</text>
</svg>
