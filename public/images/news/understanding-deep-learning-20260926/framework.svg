<g stroke="#267b99" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M485 470H584"/><path d="M1010 470H1106"/><path d="M1310 554V620H1014"/><path d="M586 694H487"/><path d="M280 620V554"/></g>
<g fill="white" stroke="#c5dae6" stroke-width="2">
<rect x="80" y="398" width="405" height="156" rx="20"/>
<rect x="586" y="398" width="424" height="156" rx="20"/>
<rect x="1108" y="398" width="412" height="156" rx="20"/>
<rect x="586" y="620" width="424" height="151" rx="20"/>
<rect x="80" y="620" width="405" height="151" rx="20"/>
</g>
<g fill="#153b55" font-size="36" font-weight="700"><text x="120" y="455">AI初稿</text><text x="626" y="455">修订与审核</text><text x="1148" y="455">最终交付</text><text x="626" y="675">授权资料回流</text><text x="120" y="675">候选版本验证</text></g>
<g fill="#577084" font-size="26"><text x="120" y="506">保存输出与运行版本</text><text x="626" y="506">定位错误  记录修改</text><text x="1148" y="506">结果与审核记录对应</text><text x="626" y="724">质量筛选  确认数据用途</text><text x="120" y="724">独立评价后决定更新</text></g>
<text x="306" y="592" fill="#27718d" font-size="23">验证通过后更新</text>
<text x="1110" y="689" fill="#27718d" font-size="25">质量 · 时间 · 残余错误</text><text x="1110" y="730" fill="#577084" font-size="23">共同构成评价依据</text>
<text x="80" y="841" fill="#5f788a" font-size="23">子殷科技原创方法示意  |  不代表各项目已完成全部环节</text>
