<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">从模型输出到医工交付</title><desc id="desc">研究方法示意。明确任务后，AI初稿经过修订与审核，形成最终交付。授权修订资料经独立验证用于新版本，验证未通过则继续开发。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#e9f3f7"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267b99"/></marker></defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/>
<g font-family="Droid Sans Fallback,Microsoft YaHei,PingFang SC,sans-serif">
