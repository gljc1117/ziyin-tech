<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">传承网络与技术版本网络</title><desc id="desc">现任传承人连接不同来源，并在实际事件中使用明确记录的技术版本或变体。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8992"/></marker></defs><rect width="1440" height="1060" fill="#f8fbfc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="72" y="82" font-size="44" fill="#203b48" font-weight="700" text-anchor="start">人物代次与技术版本，需要分别追踪</text><text x="74" y="128" font-size="26" fill="#5a727e" font-weight="400" text-anchor="start">构造性关系示例  ·  不对应真实人物或真实技术</text><text x="74" y="200" font-size="29" fill="#203b48" font-weight="600" text-anchor="start">传承网络：谁参与了学习与传授</text><rect x="74" y="239" width="363" height="150" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="100" y="287" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">前代传承人甲</text><text x="100" y="330" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">原始材料或口述来源</text><rect x="537" y="239" width="363" height="150" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="563" y="287" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">其他来源乙</text><text x="563" y="330" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">师承、院校或搜集整理</text><rect x="1000" y="239" width="363" height="150" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="1026" y="287" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">现任传承人丙</text><text x="1026" y="330" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">保留多个知识来源</text><path d="M 437 314 L 470 314 L 470 416 L 1050 416 L 1050 389" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><path d="M 900 314 L 998 314" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><text x="715" y="446" font-size="24" fill="#647c87" font-weight="400" text-anchor="middle">每项关系注明实际传授内容、时间和证据</text><text x="74" y="520" font-size="29" fill="#203b48" font-weight="600" text-anchor="start">版本网络：哪些内容沿用，哪些发生变化</text><rect x="74" y="562" width="350" height="175" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="100" y="610" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">版本 A</text><text x="100" y="653" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">前代材料中的内容</text><text x="100" y="688" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">缺失部分保持未知</text><rect x="545" y="562" width="350" height="175" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="571" y="610" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">版本 B</text><text x="571" y="653" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">当前沿用的内容</text><text x="571" y="688" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">补充明确适用条件</text><rect x="1016" y="562" width="350" height="175" rx="18" fill="#edf4f5" stroke="#b9cbd0" stroke-width="2"/><text x="1042" y="610" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">并行变体 C</text><text x="1042" y="653" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">来自另一知识来源</text><text x="1042" y="688" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">适用情境可能不同</text><path d="M 424 650 L 543 650" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><text x="484" y="619" font-size="22" fill="#647c87" font-weight="400" text-anchor="middle">有据修订</text><path d="M 720 737 L 720 799 L 634 799 L 634 841" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1191 737 L 1191 799 L 842 799 L 842 841" fill="none" stroke="#6c8992" stroke-width="3" marker-end="url(#arrow)"/><rect x="351" y="842" width="738" height="126" rx="18" fill="#e0efed" stroke="#79a79e" stroke-width="2"/><text x="377" y="890" font-size="31" fill="#203b48" font-weight="600" text-anchor="start">具体诊疗事件</text><text x="377" y="933" font-size="24" fill="#47616b" font-weight="400" text-anchor="start">记录实际使用版本、调整理由及当时可用信息</text><text x="74" y="1017" font-size="24" fill="#647c87" font-weight="400" text-anchor="start">传承关系不等于版本相同；版本改变不等于效果提高。虚构示例仅用于说明数据结构。</text></g></svg>