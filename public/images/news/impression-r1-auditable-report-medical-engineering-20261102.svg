<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">从结构化结果到可审核交付</title>
<desc id="desc">原创研究框架：确认后的结构化结果形成说明草稿，专业人员审核后，文字、数字模型和制造任务对应同一审核版本。不是现有产品界面或临床效果证明。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b213d"/><stop offset="1" stop-color="#124758"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#8ddbd0" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="960" fill="url(#bg)"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="66" y="72" fill="#88e4da" font-size="25" letter-spacing="3">子殷科技 · 文献评述与转化研究</text>
<text x="66" y="143" fill="white" font-size="48" font-weight="700">从结构化结果，到可审核交付</text>
<text x="68" y="190" fill="#bad4e2" font-size="26">基于 Impression-R1 的方法启示</text>
<rect x="66" y="242" width="1068" height="128" rx="20" fill="#174357" stroke="#517e92" stroke-width="2"/>
<text x="100" y="293" fill="white" font-size="35" font-weight="700">确认后的结构化结果</text>
<text x="100" y="338" fill="#bedce7" font-size="27">结构 · 侧别 · 测量 · 单位 · 来源 · 版本</text>
<path d="M600 370 V412 H320 V438" fill="none" stroke="#8ddbd0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="66" y="460" width="492" height="166" rx="20" fill="#174357" stroke="#517e92" stroke-width="2"/>
<text x="100" y="516" fill="#8ce4d7" font-size="24">DRAFT</text>
<text x="100" y="564" fill="white" font-size="35" font-weight="700">生成说明草稿</text>
<text x="100" y="604" fill="#bedce7" font-size="25">保留原值 · 标出缺项</text>
<path d="M558 544 H620" fill="none" stroke="#8ddbd0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="642" y="460" width="492" height="166" rx="20" fill="#145254" stroke="#8ddbd0" stroke-width="2"/>
<text x="678" y="516" fill="#8ce4d7" font-size="24">REVIEW</text>
<text x="678" y="564" fill="white" font-size="35" font-weight="700">专业审核</text>
<text x="678" y="604" fill="#d0e5e5" font-size="25">接受 · 修改 · 退回</text>
<path d="M888 626 V667 H600 V695" fill="none" stroke="#8ddbd0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="66" y="718" width="1068" height="136" rx="20" fill="#edf9f7"/>
<text x="100" y="770" fill="#114a50" font-size="35" font-weight="700">同一审核版本的交付包</text>
<text x="100" y="820" fill="#2f6570" font-size="29">文字说明　＋　数字模型　＋　制造任务</text>
<text x="68" y="918" fill="#b5d3df" font-size="22">本文候选框架 · 原创概念示意 · 非现有产品界面，非临床效果证明</text>
</g></svg>
