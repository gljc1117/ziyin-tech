<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">从技术征集到科研转化</title><desc id="desc">医院主导的平台连接保存、研究和推广条件三类独立决定，以来源、版本、条件、授权和证据记录支撑持续研究。方法示意，无实测数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75828d"/></marker></defs>
<rect width="1440" height="960" fill="#f5f4f0"/><rect width="1440" height="12" fill="#7d2431"/>
