<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2748"/>
      <stop offset="1" stop-color="#0e4d64"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="105" font-family="sans-serif" font-size="40" font-weight="bold" fill="#ffffff">一个模型不重新训练，能管多少种情况</text>
  <text x="70" y="160" font-family="sans-serif" font-size="27" fill="#bcd9e8">麻省总医院布莱根四项CT基础模型研究</text>
  <g font-family="sans-serif">
    <rect x="150" y="225" width="900" height="72" rx="10" fill="#123f63" stroke="#7fb6cf" stroke-width="2"/>
    <text x="190" y="272" font-size="28" font-weight="bold" fill="#ffffff">962例住院CT，高优先级病灶检出率88.9%</text>
    <rect x="150" y="320" width="900" height="72" rx="10" fill="#123f63" stroke="#7fb6cf" stroke-width="2"/>
    <text x="190" y="367" font-size="28" font-weight="bold" fill="#ffffff">急诊草稿96.4%正确，仅2.7%需医生修改</text>
    <rect x="150" y="415" width="900" height="72" rx="10" fill="#123f63" stroke="#7fb6cf" stroke-width="2"/>
    <text x="190" y="462" font-size="28" font-weight="bold" fill="#ffffff">成人训的模型用于儿科，平均AUC 0.964</text>
  </g>
  <text x="70" y="565" font-family="sans-serif" font-size="22" fill="#bcd9e8">子殷科技 · 研究述评与方法探索 · 2026年11月24日</text>
</svg>
