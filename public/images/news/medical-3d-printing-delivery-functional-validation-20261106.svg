<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="打印的价值，按用途验证"><rect width="1200" height="630" fill="#f1f5f9"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1200" height="12" fill="#0369a1"/><text x="64" y="67" font-size="19" fill="#0369a1" font-weight="600">ZIYIN  /  RESEARCH NOTES  /  2026.11.06</text><text x="64" y="133" font-size="44" fill="#0f172a" font-weight="700">打印的价值，按用途验证</text><text x="64" y="180" font-size="24" fill="#475569" font-weight="400">交付时效、几何一致性与实际功能需要分别评价</text><rect x="64" y="222" width="520" height="150" rx="20" fill="white" stroke="#cbd5e1"/><text x="90" y="262" font-size="18" fill="#0369a1" font-weight="700">ANATOMICAL MODEL</text><text x="90" y="310" font-size="30" fill="#0f172a" font-weight="700">解剖模型</text><text x="90" y="354" font-size="23" fill="#475569" font-weight="400">形态保真与规定使用任务</text><rect x="616" y="222" width="520" height="150" rx="20" fill="white" stroke="#cbd5e1"/><text x="642" y="262" font-size="18" fill="#0369a1" font-weight="700">SURGICAL GUIDE</text><text x="642" y="310" font-size="30" fill="#0f172a" font-weight="700">手术导板</text><text x="642" y="354" font-size="23" fill="#475569" font-weight="400">接触定位与计划执行</text><rect x="64" y="385" width="520" height="150" rx="20" fill="white" stroke="#cbd5e1"/><text x="90" y="425" font-size="18" fill="#0369a1" font-weight="700">ORTHOSIS</text><text x="90" y="473" font-size="30" fill="#0f172a" font-weight="700">康复支具</text><text x="90" y="517" font-size="23" fill="#475569" font-weight="400">适配、耐久与使用随访</text><rect x="616" y="385" width="520" height="150" rx="20" fill="white" stroke="#cbd5e1"/><text x="642" y="425" font-size="18" fill="#0369a1" font-weight="700">BIOLOGICAL MODEL</text><text x="642" y="473" font-size="30" fill="#0f172a" font-weight="700">生物微组织</text><text x="642" y="517" font-size="23" fill="#475569" font-weight="400">功能读出与外部预测能力</text><text x="64" y="587" font-size="20" fill="#64748b" font-weight="400">子殷科技原创用途矩阵  ·  不同层级证据各有范围  ·  非产品性能结论</text></g></svg>