<rect x="565" y="370" width="380" height="195" rx="16" fill="#fff" stroke="#3b7b91" stroke-width="2"/><text x="755" y="423" text-anchor="middle" font-size="40" font-weight="700">用途权限</text><text x="755" y="480" text-anchor="middle" font-size="35">处理目的与范围</text><text x="755" y="530" text-anchor="middle" font-size="35">使用条件与责任</text>
