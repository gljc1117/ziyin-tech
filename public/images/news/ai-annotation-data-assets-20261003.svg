<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="t d">
<title id="t">AI自动标注与数据产品框架</title><desc id="d">自动标注与修订形成质量证据，用途权限形成使用依据，两者共同支持数据产品。会计确认和交易按各自条件判断。</desc>
