<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">让工作自己往前走</title>
  <desc id="desc">共同目标、协作依据、有效判断和经验积累共同支持可靠交付。此图为概念关系示意，不是企业系统实现或因果效果证明。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f9ff"/><stop offset="1" stop-color="#effcf9"/></linearGradient>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="74" y="76" fill="#0e7490" font-size="19" font-weight="600" letter-spacing="2">子殷科技  方法论与探索</text>
    <text x="74" y="149" fill="#0f172a" font-size="49" font-weight="700">让工作自己往前走</text>
    <text x="74" y="198" fill="#475569" font-size="25">从一个人的 AI 助手，到一家公司的协作系统</text>
    <g stroke="#cbd5e1" stroke-width="3" fill="none">
      <path d="M338 337 L510 408 M338 529 L510 458 M862 337 L690 408 M862 529 L690 458"/>
    </g>
    <rect x="74" y="269" width="348" height="133" rx="18" fill="#ffffff" stroke="#b7d9e5"/>
    <rect x="778" y="269" width="348" height="133" rx="18" fill="#ffffff" stroke="#b7d9e5"/>
    <rect x="74" y="466" width="348" height="133" rx="18" fill="#ffffff" stroke="#b7d9e5"/>
    <rect x="778" y="466" width="348" height="133" rx="18" fill="#ffffff" stroke="#b7d9e5"/>
    <circle cx="600" cy="433" r="105" fill="#0e7490"/>
    <text x="600" y="429" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="700">可靠协作</text>
    <text x="600" y="467" text-anchor="middle" fill="#cffafe" font-size="20">服务于合格交付</text>
    <g fill="#0f172a" font-size="31" font-weight="700">
      <text x="104" y="324">共同目标</text><text x="808" y="324">协作依据</text>
      <text x="104" y="521">有效判断</text><text x="808" y="521">经验积累</text>
    </g>
    <g fill="#475569" font-size="21">
      <text x="104" y="368">不同角色理解同一项工作</text><text x="808" y="368">交接后仍能理解当前依据</text>
      <text x="104" y="565">让人有条件发现并处理问题</text><text x="808" y="565">让复核后的反馈支持改进</text>
    </g>
    <text x="74" y="667" fill="#64748b" font-size="18">概念关系示意  不表示具体系统架构或已验证的因果关系</text>
    <text x="1126" y="667" text-anchor="end" fill="#475569" font-size="18">瑜秀曈芯</text>
  </g>
</svg>
